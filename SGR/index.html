<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>신비아파트 기타 연습</title>
    <link rel="stylesheet" href="clementine.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Jua', sans-serif;
            background-image: linear-gradient(135deg, #e0f2fe 0%, #ede9fe 100%);
            display: flex;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            user-select: none;
        }

        /* --- 🌟 밤하늘 및 별 효과 레이어 --- */
        #night-overlay, #star-container {
            position: fixed;
            top: 0; left: 0; 
            width: 100%; height: 100%;
            pointer-events: none;
        }

        #night-overlay {
            background: linear-gradient(135deg, #1e1b4b 0%, #020617 100%);
            opacity: 0;
            transition: opacity 1.5s ease;
            z-index: 1;
        }

        #star-container {
            z-index: 2;
            overflow: hidden;
        }

        .star {
            position: absolute;
            color: #fde047;
            text-shadow: 0 0 10px #fef08a, 0 0 20px #fde047;
            animation: twinkle 2s infinite ease-in-out alternate;
        }

        @keyframes twinkle {
            0% { transform: scale(0.8); opacity: 0.3; }
            100% { transform: scale(1.2); opacity: 1; }
        }

        /* --- 홈 화면 --- */
        #home-screen {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        #home-screen h1 {
            font-size: 3.5rem;
            color: #4c1d95;
            margin-bottom: 30px;
            text-align: center;
            text-shadow: 2px 2px 0px #fff;
        }

        .mode-btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 480px;
        }

        .mode-btn {
            font-family: 'Jua', sans-serif;
            font-size: 1.6rem;
            padding: 16px 28px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 0 rgba(0,0,0,0.15);
            background-color: #3b82f6;
            color: white;
            transition: transform 0.1s;
            text-align: center;
        }
        
        .mode-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,0.15); }
        .btn-green { background-color: #10b981; }
        .btn-yellow { background-color: #f59e0b; color: #fff; }
        .btn-purple { background-color: #8b5cf6; }
        .btn-pink { background-color: #ec4899; }
        .btn-gray { background-color: #64748b; }

        /* --- 연습 화면 --- */
        #practice-screen {
            position: relative;
            z-index: 10;
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: row;
        }

        #left-panel {
            flex: 4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            border-right: 4px dashed rgba(196, 181, 253, 0.5);
            position: relative;
        }

        #back-home-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 1.2rem;
            padding: 10px 20px;
            background-color: #94a3b8;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }

        #progress-tag {
            font-size: 1.5rem;
            background-color: #4c1d95;
            color: #fff;
            padding: 6px 18px;
            border-radius: 20px;
            margin-bottom: 10px;
            display: none;
        }

        #note-display {
            font-size: 3.8rem;
            color: #4c1d95;
            margin: 0;
            text-shadow: 3px 3px 0px #fff, 5px 5px 0px #a78bfa;
            text-align: center;
            word-break: keep-all;
        }

        #character-area {
            margin-top: 15px;
            width: 220px;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
        }

        .bounce { transform: scale(1.1) translateY(-20px); }

        #character-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.2));
        }

        #right-panel {
            flex: 6;
            min-height: 0;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
            gap: 20px;
        }

        #practice-content {
            width: 100%;
            flex: 1 1 0;
            min-height: 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 4px 0 12px;
            box-sizing: border-box;
            overscroll-behavior: contain;
        }
        #practice-content > #fretboard-container, #practice-content > #chord-panel { flex-shrink: 0; }
        #practice-controls {
            flex: 0 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        #fretboard-container {
            position: relative;
            width: 100%;
            max-width: 750px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 10px 15px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        #board-img {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 10px;
        }

        #red-dot {
            position: absolute;
            width: 8%; 
            aspect-ratio: 1 / 1;
            background-color: #ef4444; 
            border-radius: 50%;
            transform: translate(-50%, -50%); 
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.9);
            display: none; 
            transition: all 0.3s ease;
            z-index: 5;
        }

        #practice-screen.bass-mode #red-dot {
            width: 3.8%;
        }

        #status-message {
            font-size: 1.8rem;
            padding: 10px 20px;
            border-radius: 30px;
            text-align: center;
            width: 90%;
            box-sizing: border-box;
            word-break: keep-all;
            box-shadow: 0 5px 10px rgba(0,0,0,0.1);
        }

        .status-wait { background-color: #e2e8f0; color: #475569; }
        .status-listen { background-color: #d1fae5; color: #059669; }
        .status-success { background-color: #fef3c7; color: #d97706; }
        .mic-controls { width: 90%; max-width: 620px; display: flex; flex-wrap: wrap;
            align-items: center; gap: 8px; color: #475569; font-size: .95rem; }
        #mic-input-status { flex: 1 1 100%; text-align: center; }
        #mic-level { flex: 1; min-width: 80px; height: 12px; }
        #mic-reconnect-btn { font: inherit; border: 0; border-radius: 16px; padding: 8px 14px;
            color: #4c1d95; background: #ede9fe; cursor: pointer; }
        #mic-reconnect-btn:disabled { opacity: .5; cursor: default; }
        .sensitivity-control { display: flex; align-items: center; justify-content: center; gap: 6px;
            width: 100%; font-size: .9rem; }
        #mic-sensitivity { font: inherit; border: 1px solid #c4b5fd; border-radius: 10px;
            padding: 5px 8px; color: #4c1d95; background: #fff; }
        .sensitivity-hint { color: #64748b; font-size: .8rem; }

        /* --- 코드 연습 패널 스타일 --- */
        #chord-panel { display: none; width: 100%; max-width: 620px; text-align: center; }
        #chord-card { background: #fff; border-radius: 24px; padding: 14px 20px;
            box-shadow: 0 10px 24px rgba(76,29,149,.12); }
        #chord-diagram svg { width: 100%; max-width: 250px; height: 240px; }
        #chord-instruction { color: #4c1d95; font-size: 1.15rem; line-height: 1.5; margin: 4px 0; }
        #chord-help { color: #64748b; font-size: .95rem; line-height: 1.5; margin: 6px 0; }
        #chord-sequence { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 12px 0; }
        .chord-step { padding: 6px 12px; border-radius: 14px; background: #e2e8f0; color: #475569; }
        .chord-step.current { background: #7c3aed; color: #fff; box-shadow: 0 0 0 3px #ddd6fe; }
        .chord-step.done { background: #d1fae5; color: #047857; }
        #chord-detected { color: #4c1d95; min-height: 1.5em; margin: 6px 0 0; }
        #practice-screen.chord-mode #right-panel { gap: 12px; overflow: hidden; }

        .btn-group {
            display: flex;
            gap: 15px;
            width: 90%;
            max-width: 500px;
            justify-content: center;
        }

        .action-btn {
            font-family: 'Jua', sans-serif;
            font-size: 1.5rem;
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 0 rgba(0,0,0,0.2);
            flex: 1;
        }
        
        .action-btn:active { transform: translateY(5px); box-shadow: 0 0px 0 rgba(0,0,0,0.2); }

        #start-listen-btn { background-color: #3b82f6; color: white; display: none; }
        #retry-btn { background-color: #fbbf24; color: #78350f; display: none; }
        #next-btn { background-color: #8b5cf6; color: white; display: none; }
        
        #debug-freq {
            position: absolute;
            bottom: 10px;
            right: 10px;
            font-size: 1rem;
            color: #94a3b8;
            z-index: 100;
        }

        /* 📱 반응형 모바일 */
        @media screen and (max-width: 1100px), screen and (orientation: portrait) {
            body { flex-direction: column; height: 100dvh; overflow: hidden; }
            #practice-screen { flex-direction: column; }
            #left-panel { flex: none; border-right: none; border-bottom: 2px dashed rgba(196, 181, 253, 0.5); padding: 42px 10px 6px; }
            #note-display { font-size: 2rem; }
            #character-area { width: 65px; height: 65px; margin-top: 2px; }
            #progress-tag { font-size: 1rem; margin-bottom: 3px; padding: 4px 12px; }
            #right-panel { flex: 1; padding: 6px 10px 10px; gap: 6px; overflow: hidden; }
            #practice-screen.chord-mode #right-panel { gap: 6px; }
            #practice-controls { gap: 6px; }
            #status-message { font-size: 1.05rem; padding: 7px 12px; line-height: 1.25; }
            .mic-controls { gap: 5px; width: 96%; font-size: .8rem; }
            #mic-input-status { line-height: 1.25; }
            #mic-reconnect-btn { padding: 7px 10px; min-height: 36px; }
            .sensitivity-control { font-size: .8rem; gap: 4px; }
            .sensitivity-hint { font-size: .72rem; }
            #chord-diagram svg { height: 180px; }
            #chord-card { padding: 8px 10px; }
            #chord-instruction { font-size: 1rem; }
            #chord-help { font-size: .8rem; }
            #chord-sequence { gap: 5px; margin: 5px 0 10px; }
            .chord-step { padding: 5px 10px; }
            .action-btn { font-size: 1.1rem; padding: 10px 12px; min-height: 44px; }
            #home-screen h1 { font-size: 2.4rem; margin-bottom: 20px; }
            .mode-btn { font-size: 1.3rem; padding: 14px 20px; }
            #back-home-btn { top: 10px; left: 10px; font-size: 0.9rem; padding: 6px 12px; }
        }
        @media screen and (max-height: 480px) and (orientation: landscape) {
            #practice-screen { flex-direction: row; }
            #left-panel { flex: 0 0 25%; padding: 42px 8px 6px; box-sizing: border-box; border-bottom: 0; }
            #character-area { width: 55px; height: 55px; }
            #note-display { font-size: 1.6rem; }
            #right-panel { min-width: 0; }
            .sensitivity-hint { display: none; }
        }
    </style>
</head>
<body>

    <!-- 별 & 밤하늘 컨테이너 -->
    <div id="night-overlay"></div>
    <div id="star-container"></div>

    <!-- 1. 홈 화면 -->
    <div id="home-screen">
        <h1>🎸 신비아파트 기타 연습 🎸</h1>
        
        <!-- 메인 메뉴 -->
        <div class="mode-btn-group" id="main-menu">
            <button class="mode-btn" id="mode-scale-btn">도레미파솔라시도 연습</button>
            <button class="mode-btn btn-green" id="mode-open-btn">개방현 (6줄) 연습</button>
            <button class="mode-btn btn-yellow" id="mode-song-btn">작은별 연주하기 ⭐️</button>
            <button class="mode-btn btn-green" id="mode-clementine-btn">🎵 클레멘타인 · 4마디씩 따라 치기</button>
            <button class="mode-btn btn-purple" id="mode-base-menu-btn">🎸 베이스 음 (5, 6번줄) 외우기</button>
            <button class="mode-btn btn-pink" id="mode-chord-btn">🎸 코드 스트로크 연습 (랜덤 6단계)</button>
        </div>

        <!-- 베이스 음 서브 메뉴 -->
        <div class="mode-btn-group" id="base-sub-menu" style="display: none;">
            <button class="mode-btn btn-purple" id="mode-base-c-btn">🎹 C 음계 (흰건반) 외우기 (10문제)</button>
            <button class="mode-btn btn-pink" id="mode-base-chromatic-btn">🎶 12음 (샵/플랫 포함) 외우기 (10문제)</button>
            <button class="mode-btn btn-gray" id="base-sub-back-btn">⬅️ 이전으로</button>
        </div>
    </div>

    <!-- 2. 연습 화면 -->
    <div id="practice-screen">
        <div id="left-panel">
            <button id="back-home-btn">🏠 홈으로</button>
            <div id="progress-tag">문제 1 / 10</div>
            <h1 id="note-display">도 (C)</h1>
            <div id="character-area">
                <img id="character-img" src="shinbi_1.png" alt="신비 캐릭터">
            </div>
        </div>

        <div id="right-panel">
            <div id="practice-content">
            <div id="fretboard-container">
                <img id="board-img" src="fret.jpeg" alt="지판 이미지">
                <div id="red-dot"></div>
            </div>
            
            <!-- 코드 연습 전용 패널 -->
            <div id="chord-panel">
                <div id="chord-sequence" aria-label="코드 연습 진행 순서"></div>
                <div id="chord-card">
                    <div id="chord-diagram"></div>
                    <p id="chord-instruction"></p>
                    <p id="chord-help">표준 튜닝 · 카포 없이 연습해요.<br>○ 개방현 · × 치지 않는 줄 · 숫자 1~4는 왼손 손가락이에요.</p>
                    <p id="chord-detected" role="status" aria-live="polite"></p>
                </div>
            </div>

            <section id="clementine-panel" aria-label="클레멘타인 멜로디 연습">
                <div class="clem-heading"><p id="clem-range"></p><span id="clem-counter"></span></div>
                <div class="clem-parts" aria-label="연습 구간 선택">
                    <button id="clem-part-0" class="clem-part" type="button">1구간</button>
                    <button id="clem-part-1" class="clem-part" type="button">2구간</button>
                    <button id="clem-part-2" class="clem-part" type="button">3구간</button>
                    <button id="clem-part-3" class="clem-part" type="button">4구간</button>
                </div>
                <h2 id="clem-target" aria-live="polite"></h2>
                <div id="clementine-score"></div>
                <p id="clem-feedback" role="status" aria-live="polite"></p>
                <p class="clem-caption">위 멜로디만 연주해요 · 표준 튜닝 · 카포 없이<br>시범은 원래 리듬, 따라 치기는 시간 제한 없이!<br>제공 악보의 위 성부 · 편곡 WoojeongPark (박우정)</p>
            </section>
            </div>
            <div id="practice-controls">
            <div id="status-message" class="status-wait" role="status" aria-live="polite">기타 지판을 잡고 준비해주세요!</div>
            <div id="clem-controls">
                <button id="clem-demo-btn" type="button">▶ 시범 듣기</button>
                <button id="clem-stop-btn" type="button" hidden>■ 시범 멈추기</button>
                <button id="clem-reset-btn" type="button" hidden>↻ 구간 다시 연습</button>
                <button id="clem-next-btn" type="button" hidden>다음 4마디 →</button>
            </div>
            <div class="mic-controls">
                <span id="mic-input-status" role="status" aria-live="polite">소리 듣기 시작을 누르면 마이크를 연결해요.</span>
                <meter id="mic-level" min="0" max="1" value="0" aria-label="마이크 입력 크기"></meter>
                <button id="mic-reconnect-btn" type="button">🎤 마이크 다시 연결</button>
                <label class="sensitivity-control" for="mic-sensitivity">마이크 감도
                    <select id="mic-sensitivity">
                        <option value="2">보통</option>
                        <option value="4" selected>높음</option>
                        <option value="8">아주 높음</option>
                    </select>
                    <span class="sensitivity-hint">작게 들리면 ‘아주 높음’</span>
                </label>
            </div>
            
            <div class="btn-group">
                <button id="start-listen-btn" class="action-btn">🎧 소리 듣기 시작</button>
                <button id="retry-btn" class="action-btn">🔄 같은 음 다시 치기</button>
                <button id="next-btn" class="action-btn">➡ 다음 음으로</button>
            </div>
            </div>
        </div>
    </div>

    <div id="debug-freq">인식된 Hz: 0.0</div>

    <script src="clementine.js"></script>
    <script>
        // --- 1. 베이스 연습 전용 X 좌표 (fretboard.jpeg): 0~12프렛 ---
        const bassFretXPositions = [
            '8.0%', '18.2%', '27.3%', '35.9%', '43.8%', '51.2%', 
            '58.2%', '64.7%', '70.8%', '76.5%', '82.0%', '87.1%', '92.0%'
        ];

        const bassStringY = {
            6: '64.5%', 5: '57.5%', 4: '50.5%', 3: '43.5%', 2: '36.5%', 1: '29.5%'
        };

        const scaleData = [
            { name: "도 (C)", freq: 130.81, x: '84%', y: '72%' },
            { name: "레 (D)", freq: 146.83, x: '19%', y: '58%' },
            { name: "미 (E)", freq: 164.81, x: '62%', y: '58%' },
            { name: "파 (F)", freq: 174.61, x: '84%', y: '58%' },
            { name: "솔 (G)", freq: 196.00, x: '20%', y: '46%' },
            { name: "라 (A)", freq: 220.00, x: '61%', y: '46%' },
            { name: "시 (B)", freq: 246.94, x: '19%', y: '36%' },
            { name: "높은 도(C)", freq: 261.63, x: '38%', y: '35%' }
        ];

        const openStringsData = [
            { name: "6번줄 (미)", freq: 82.41, x: '56%', y: '72%' },
            { name: "5번줄 (라)", freq: 110.00, x: '56%', y: '63%' },
            { name: "4번줄 (레)", freq: 146.83, x: '56%', y: '55%' },
            { name: "3번줄 (솔)", freq: 196.00, x: '56%', y: '45%' },
            { name: "2번줄 (시)", freq: 246.94, x: '56%', y: '37%' },
            { name: "1번줄 (미)", freq: 329.63, x: '56%', y: '29%' }
        ];

        const base6StringNotes = [
            { name: "E - 6번줄", freq: 82.41, isNatural: true },
            { name: "F - 6번줄", freq: 87.31, isNatural: true },
            { name: "F#/Gb - 6번줄", freq: 92.50, isNatural: false },
            { name: "G - 6번줄", freq: 98.00, isNatural: true },
            { name: "G#/Ab - 6번줄", freq: 103.83, isNatural: false },
            { name: "A - 6번줄", freq: 110.00, isNatural: true },
            { name: "A#/Bb - 6번줄", freq: 116.54, isNatural: false },
            { name: "B - 6번줄", freq: 123.47, isNatural: true },
            { name: "C - 6번줄", freq: 130.81, isNatural: true },
            { name: "C#/Db - 6번줄", freq: 138.59, isNatural: false },
            { name: "D - 6번줄", freq: 146.83, isNatural: true },
            { name: "D#/Eb - 6번줄", freq: 155.56, isNatural: false },
            { name: "높은 E - 6번줄", freq: 164.81, isNatural: true }
        ].map((item, fret) => ({
            ...item,
            x: bassFretXPositions[fret],
            y: bassStringY[6]
        }));

        const base5StringNotes = [
            { name: "A - 5번줄", freq: 110.00, isNatural: true },
            { name: "A#/Bb - 5번줄", freq: 116.54, isNatural: false },
            { name: "B - 5번줄", freq: 123.47, isNatural: true },
            { name: "C - 5번줄", freq: 130.81, isNatural: true },
            { name: "C#/Db - 5번줄", freq: 138.59, isNatural: false },
            { name: "D - 5번줄", freq: 146.83, isNatural: true },

        // --- 마이크 및 피치 디텍션 ---
        function hasLiveInput() {
            return !!(audioContext && audioContext.state !== 'closed' && analyser && chordAnalyser && micStream &&
                micStream.getAudioTracks().some(track => track.readyState === 'live' && track.enabled));
        }

        function resumeAudioContext(context, generation) {
            if (generation !== micGeneration || context.state === 'closed') return Promise.resolve(false);
            if (context.state === 'running') return Promise.resolve(true);
            return new Promise(resolve => {
                let done = false;
                const finish = ok => {
                    if (done) return;
                    done = true;
                    clearTimeout(timeout);
                    context.removeEventListener('statechange', changed);
                    resolve(ok && generation === micGeneration && context.state === 'running');
                };
                const changed = () => {
                    if (context.state === 'running') finish(true);
                    else if (context.state === 'closed') finish(false);
                };
                // Some browsers leave resume() pending rather than rejecting it.
                // Keep a usable button instead of leaving the UI permanently busy.
                const timeout = setTimeout(() => finish(false), 2500);
                context.addEventListener('statechange', changed);
                try { Promise.resolve(context.resume()).then(changed, () => finish(false)); }
                catch (err) { finish(false); }
            });
        }

        function microphoneErrorMessage(error) {
            if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
                return '마이크는 HTTPS 주소에서 사용할 수 있어요. HTTPS 연습 페이지로 다시 열어주세요.';
            if (error.name === 'NotAllowedError' || error.name === 'SecurityError')
                return '브라우저와 기기의 마이크 접근을 허용한 뒤 다시 연결해주세요.';
            if (error.name === 'NotFoundError') return '사용할 마이크가 없어요. 마이크 연결과 기기 설정을 확인해주세요.';
            if (error.name === 'NotReadableError' || error.name === 'AbortError')
                return '마이크를 사용할 수 없어요. 통화·녹음 앱을 종료하거나 입력 장치를 확인한 뒤 다시 연결해주세요.';
            return '마이크 연결에 실패했어요. 마이크 다시 연결을 눌러주세요.';
        }

        function startMicSystem() {
            if (micPromise) return micPromise;
            if (hasLiveInput()) {
                const context = audioContext;
                const generation = micGeneration;
                startListenBtn.disabled = true;
                const operation = resumeAudioContext(context, generation).then(ok => {
                    if (generation !== micGeneration || context !== audioContext) return false;
                    startListenBtn.disabled = false;
                    if (!ok) pauseListening('오디오가 일시 정지됐어요. 소리 듣기 시작을 다시 눌러주세요.');
                    return ok;
                });
                micPromise = operation;
                operation.then(() => { if (micPromise === operation) micPromise = null; });
                return operation;
            }
            if (audioContext || micStream) stopMicSystem();
            const generation = micGeneration;
            startListenBtn.disabled = true;
            micReconnectBtn.disabled = false;
            setStatus('마이크 연결 중이에요. 권한 요청이 나타나면 허용해주세요 🎧', 'status-wait');
            micInputStatus.innerText = '마이크 연결을 기다리고 있어요.';
            let context = null, stream = null;
            const operation = (async () => {
                try {
                    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('microphone-unavailable');
                    context = new (window.AudioContext || window.webkitAudioContext)();
                    audioContext = context;
                    // Do not await this first resume: on some mobile browsers it
                    // cannot finish until microphone capture has actually started.
                    Promise.resolve(context.resume()).catch(() => {});
                    stream = await navigator.mediaDevices.getUserMedia({ audio: {
                        echoCancellation: false, noiseSuppression: false, autoGainControl: false
                    } });
                    if (generation !== micGeneration) {
                        stream.getTracks().forEach(track => track.stop());
                        if (context.state !== 'closed') context.close().catch(() => {});
                        return false;
                    }
                    if (!stream.getAudioTracks().some(track => track.readyState === 'live'))
                        throw new Error('no-live-audio-track');
                    micStream = stream;
                    analyser = context.createAnalyser();
                    analyser.fftSize = 4096;
                    chordAnalyser = context.createAnalyser();
                    chordAnalyser.fftSize = chordFFTSize;
                    chordAnalyser.smoothingTimeConstant = 0;
                    microphone = context.createMediaStreamSource(stream);
                    microphone.connect(analyser);
                    microphone.connect(chordAnalyser);
                    // Keep a rendered graph without playing microphone sound back.
                    silentOutput = context.createGain();
                    silentOutput.gain.value = 0;
                    analyser.connect(silentOutput);
                    chordAnalyser.connect(silentOutput);
                    silentOutput.connect(context.destination);
                    context.addEventListener('statechange', () => {
                        if (generation !== micGeneration || !isListening || context.state === 'running') return;
                        pauseListening('오디오 입력이 중단됐어요. 소리 듣기 시작을 다시 눌러주세요.');
                        micInputStatus.innerText = '오디오가 일시 정지되어 있어요.';
                    });
                    for (const track of stream.getAudioTracks()) {
                        track.addEventListener('mute', () => {
                            if (generation !== micGeneration) return;
                            pauseListening('마이크 입력이 잠시 중단됐어요. 통화나 다른 앱을 확인한 뒤 다시 시작해주세요.');
                            micInputStatus.innerText = '마이크 입력이 일시 중단되어 있어요.';
                            micLevel.value = 0;
                        });
                        track.addEventListener('ended', () => {
                            if (generation !== micGeneration) return;
                            pauseListening('마이크 연결이 종료됐어요. 마이크 다시 연결을 눌러주세요.');
                            stopMicSystem();
                            micInputStatus.innerText = '마이크 연결이 종료됐어요.';
                        });
                    }
                    lastInputAt = performance.now();
                    lastMeterUpdate = -Infinity;
                    animationFrame = requestAnimationFrame(updatePitch);
                    // getUserMedia may interrupt a context that was already running.
                    const ok = await resumeAudioContext(context, generation);
                    if (generation !== micGeneration) return false;
                    startListenBtn.disabled = false;
                    if (!ok) pauseListening('마이크는 연결됐지만 오디오가 멈춰 있어요. 소리 듣기 시작을 다시 눌러주세요.');
                    else micInputStatus.innerText = '마이크 연결 완료 · 소리 입력을 기다리고 있어요.';
                    return ok;
                } catch (err) {
                    if (stream) stream.getTracks().forEach(track => track.stop());
                    if (context && context.state !== 'closed') context.close().catch(() => {});
                    if (generation === micGeneration) {
                        stopMicSystem();
                        pauseListening(microphoneErrorMessage(err));
                        micInputStatus.innerText = '마이크 연결을 확인해주세요.';
                    }
                    return false;
                }
            })();
            micPromise = operation;
            operation.then(() => { if (micPromise === operation) micPromise = null; });
            return operation;
        }

        function stopMicSystem() {
            micGeneration++;
            micPromise = null;
            if (animationFrame !== null) cancelAnimationFrame(animationFrame);
            animationFrame = null;
            if (microphone) microphone.disconnect();
            if (silentOutput) silentOutput.disconnect();
            if (micStream) micStream.getTracks().forEach(track => track.stop());
            const context = audioContext;
            audioContext = null;
            micStream = null;
            microphone = null;
            silentOutput = null;
            analyser = null;
            chordAnalyser = null;
            if (context && context.state !== 'closed') context.close().catch(() => {});
            micLevel.value = 0;
            micInputStatus.innerText = '소리 듣기 시작을 누르면 마이크를 연결해요.';
            startListenBtn.disabled = false;
        }

        micReconnectBtn.addEventListener('click', () => {
            if (!currentMode || isCorrect) return;
            if (currentMode === 'clementine' && !clementineLesson.canListen()) return;
            listenRequest++;
            isListening = false;
            stopMicSystem();
            prepareNote();
            startAutoListen();
        });

        function releaseHiddenInput() {
            if (!currentMode) return;
            pauseListening('화면으로 돌아왔어요. 소리 듣기 시작을 다시 눌러주세요.');
            stopMicSystem();
            if (currentMode === 'clementine') clementineLesson.suspend();
        }
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) releaseHiddenInput();
        });
        window.addEventListener('pagehide', releaseHiddenInput);

        // 코드 분석 모델
        let chordModelCache = null;
        function buildChordModels(sampleRate, fftSize) {
            const firstBin = Math.ceil(65 * fftSize / sampleRate);
            const lastBin = Math.min(fftSize / 2 - 1, Math.floor(2200 * fftSize / sampleRate));
            const sinc = x => Math.abs(x) < 1e-8 ? 1 : Math.sin(Math.PI * x) / (Math.PI * x);
            const windowPeak = x => Math.abs(sinc(x) + (0.25 / 0.42) * (sinc(x - 1) + sinc(x + 1)) +
                (0.04 / 0.42) * (sinc(x - 2) + sinc(x + 2)));
            const models = [-20,-10,0,10,20].map(cents => {
                const columns = [];
                for (let midi = 40; midi <= 76; midi++) {
                    const indices = [], values = [];
                    const f = 440 * Math.pow(2, (midi - 69 + cents / 100) / 12);
                    let norm = 0;
                    for (let h = 1; h <= 8 && f * h <= 2200; h++) {
                        const center = f * h * fftSize / sampleRate;
                        for (let bin = Math.ceil(center - 3); bin <= Math.floor(center + 3); bin++) {
                            if (bin < firstBin || bin > lastBin) continue;
                            const value = windowPeak(bin - center) / h;
                            if (value < 0.001) continue;
                            indices.push(bin - firstBin);
                            values.push(value);
                            norm += value * value;
                        }
                    }
                    columns.push({ midi, indices, values, norm });
                }
                return columns;
            });
            return { sampleRate, fftSize, firstBin, lastBin, models };
        }

        function analyzeChordSpectrum(spectrumDb, sampleRate, fftSize) {
            const unknown = { name: null, score: 0, fit: 0 };
            if (!Number.isFinite(sampleRate) || sampleRate <= 0 || spectrumDb.length !== fftSize / 2) return unknown;
            if (!chordModelCache || chordModelCache.sampleRate !== sampleRate || chordModelCache.fftSize !== fftSize) {
                chordModelCache = buildChordModels(sampleRate, fftSize);
            }
            const { firstBin, lastBin, models } = chordModelCache;
            let maximum = -Infinity;
            for (let bin = firstBin; bin <= lastBin; bin++) {
                if (Number.isFinite(spectrumDb[bin])) maximum = Math.max(maximum, spectrumDb[bin]);
            }
            if (maximum < -85) return unknown;
            const signal = new Float64Array(lastBin - firstBin + 1);
            let energy = 0;
            for (let i = 0; i < signal.length; i++) {
                const db = spectrumDb[firstBin + i];
                signal[i] = Number.isFinite(db) ? Math.max(0, Math.pow(10, (db - maximum) / 20) - 0.015) : 0;
                energy += signal[i] * signal[i];
            }
            if (energy < 0.1) return unknown;
            let best = null;
            for (const columns of models) {
                const residual = signal.slice();
                const strengths = new Float64Array(columns.length);
                for (let pass = 0; pass < 12; pass++) {
                    let change = 0;
                    for (let j = 0; j < columns.length; j++) {
                        const column = columns[j];
                        let dot = 0;
                        for (let k = 0; k < column.indices.length; k++) dot += residual[column.indices[k]] * column.values[k];
                        const next = Math.max(0, strengths[j] + (dot - 0.012) / column.norm);
                        const delta = next - strengths[j];
                        if (Math.abs(delta) < 1e-6) continue;
                        strengths[j] = next;
                        change += Math.abs(delta);
                        for (let k = 0; k < column.indices.length; k++) residual[column.indices[k]] -= delta * column.values[k];
                    }
                    if (change < 0.001) break;
                }
                let error = 0;
                for (const value of residual) error += value * value;
                if (!best || error < best.error) best = { error, strengths, columns };
            }
            const fit = 1 - best.error / energy;
            if (fit < 0.70) return { ...unknown, fit };
            const strongest = Math.max(...best.strengths);
            const chroma = new Float64Array(12);
            let total = 0, noteCount = 0;
            best.strengths.forEach((value, i) => {
                if (value < strongest * 0.14) return;
                chroma[best.columns[i].midi % 12] += value;
                total += value;
                noteCount++;
            });
            if (noteCount < 3 || total <= 0) return { ...unknown, fit };
            const candidates = [];
            for (let root = 0; root < 12; root++) for (const third of [3,4]) {
                const shares = [root, (root + third) % 12, (root + 7) % 12].map(pc => chroma[pc] / total);
                const score = shares.reduce((sum, x) => sum + x, 0);
                candidates.push({ root, third, score, minimum: Math.min(...shares) });
            }
            candidates.sort((a,b) => b.score - a.score);
            const winner = candidates[0];
            if (winner.minimum < 0.10 || winner.score < 0.87 || winner.score - candidates[1].score < 0.12) {
                return { ...unknown, fit, score: winner.score };
            }
            const chord = chordData.find(c => c.root === winner.root && c.third === winner.third);
            return { name: chord ? chord.name : null, score: winner.score, fit };
        }

        function updateChordPractice(now, rms) {
            if (!isListening || isCorrect || currentMode !== 'chord' || !chordAnalyser || !audioContext) return;
            const attempt = chordAttempt;
            // Learn a stable, quiet background instead of assuming all microphones
            // have the same absolute noise floor. Loud sustained notes never arm.
            if (!attempt.armed && attempt.onset === null) {
                if (rms >= 0.008) {
                    attempt.quietSamples = [];
                    return;
                }
                attempt.quietSamples.push({ time: now, level: rms });
                while (attempt.quietSamples.length && now - attempt.quietSamples[0].time > 600)
                    attempt.quietSamples.shift();
                const levels = attempt.quietSamples.map(sample => sample.level);
                const low = Math.min(...levels), high = Math.max(...levels);
                if (high > Math.max(low * 1.45, 0.0005)) {
                    attempt.quietSamples = [{ time: now, level: rms }];
                    return;
                }
                if (levels.length >= 3 && now - attempt.quietSamples[0].time >= 220) {
                    levels.sort((a,b) => a-b);
                    attempt.noise = Math.max(0.00005, levels[Math.floor(levels.length * 0.25)]);
                    attempt.armed = true;
                    attempt.quietSince = now;
                    setStatus('준비됐어요! 코드를 한 번 쓸어 내려주세요 🎸', 'status-listen');
                }
                return;
            }
            const quietLimit = attempt.onset !== null ?
                Math.max(0.004 / inputSensitivity, attempt.noise * 1.15) :
                Math.max(0.012 / inputSensitivity, attempt.noise * 1.8);
            if (rms < quietLimit) {
                attempt.noise = attempt.noise * 0.9 + rms * 0.1;
                if (attempt.quietSince === null) attempt.quietSince = now;
                attempt.onset = null;
                attempt.matches = 0;
                attempt.observations = 0;
                if (!attempt.armed && now - attempt.quietSince >= 220) {
                    attempt.armed = true;
                    setStatus('준비됐어요! 코드를 한 번 쓸어 내려주세요 🎸', 'status-listen');
                }
                return;
            }
            attempt.quietSince = null;
            if (!attempt.armed) return;
            if (attempt.onset === null) {
                if (rms < Math.max(0.018 / inputSensitivity, attempt.noise * 3)) return;
                attempt.onset = now;
                setStatus('코드 소리를 확인하고 있어요 🎧', 'status-listen');
            }
            const age = now - attempt.onset;
            if (age > 1200) {
                attempt.armed = false;
                attempt.onset = null;
                attempt.quietSamples = [];
                setStatus('아직 맞지 않았어요. 줄 울림을 멈추고 다시 쳐주세요 🎸', 'status-wait');
                return;
            }
            if (age < 360 || now - attempt.lastAnalysis < 75) return;
            attempt.lastAnalysis = now;
            chordAnalyser.getFloatFrequencyData(chordSpectrum);
            const result = analyzeChordSpectrum(chordSpectrum, audioContext.sampleRate, chordFFTSize);
            attempt.observations++;
            const target = activeData[currentIndex].name;
            if (result.name === target) attempt.matches++;
            const detected = document.getElementById('chord-detected');
            const message = result.name ? `들리는 코드: ${result.name}` : '코드 소리가 아직 확실하지 않아요.';
            if (detected.innerText !== message) detected.innerText = message;
            if (attempt.matches >= 3 && attempt.matches / attempt.observations >= 0.7) handleCorrectAnswer();
        }

        const bufferLength = 4096;
        const buffer = new Float32Array(bufferLength);

        function autoCorrelate(buf, sampleRate) {
            let SIZE = buf.length;
            let rms = 0;

            for (let i = 0; i < SIZE; i++) {
                let val = buf[i];
                rms += val * val;
            }
            rms = Math.sqrt(rms / SIZE);
            if (rms < 0.01 / inputSensitivity) return -1;

            let r1 = 0, r2 = SIZE - 1, thres = 0.2;
            for (let i = 0; i < SIZE / 2; i++)
                if (Math.abs(buf[i]) < thres) { r1 = i; break; }
            for (let i = 1; i < SIZE / 2; i++)
                if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; }

            buf = buf.slice(r1, r2);
            SIZE = buf.length;

            let c = new Array(SIZE).fill(0);
            for (let i = 0; i < SIZE; i++)
                for (let j = 0; j < SIZE - i; j++)
                    c[i] = c[i] + buf[j] * buf[j + i];

            let d = 0; while (c[d] > c[d + 1]) d++;
            let maxval = -1, maxpos = -1;
            for (let i = d; i < SIZE; i++) {
                if (c[i] > maxval) {
                    maxval = c[i];
                    maxpos = i;
                }
            }
            let T0 = maxpos;
            let x1 = c[T0 - 1], x2 = c[T0], x3 = c[T0 + 1];
            let a = (x1 + x3 - 2 * x2) / 2;
            let b = (x3 - x1) / 2;
            if (a) T0 = T0 - b / (2 * a);

            return sampleRate / T0;
        }

        function updatePitch() {
            if (!currentMode || !audioContext || !analyser) {
                animationFrame = null;
                return;
            }
            if (audioContext.state !== 'running' || !hasLiveInput() || micStream.getAudioTracks().some(track => track.muted)) {
                if (isListening) pauseListening('마이크 입력이 중단됐어요. 소리 듣기 시작 또는 마이크 다시 연결을 눌러주세요.');
                animationFrame = requestAnimationFrame(updatePitch);
                return;
            }
            analyser.getFloatTimeDomainData(buffer);
            let sum = 0;
            for (const value of buffer) sum += value * value;
            const rms = Math.sqrt(sum / buffer.length);
            const now = performance.now();
            if (rms > 0.0001) lastInputAt = now;
            if (now - lastMeterUpdate >= 120) {
                lastMeterUpdate = now;
                micLevel.value = Math.min(1, rms * 12 * inputSensitivity);
                const message = rms > 0.003 / inputSensitivity ? '🎤 소리가 들어오고 있어요.' : now - lastInputAt > 5000 ?
                    '입력이 잡히지 않으면 마이크 다시 연결을 눌러주세요.' : '마이크 연결 완료 · 소리 입력을 기다리고 있어요.';
                if (micInputStatus.innerText !== message) micInputStatus.innerText = message;
            }
            if (isListening && !isCorrect) {
                if (currentMode === 'chord') {
                    updateChordPractice(now, rms);
                    animationFrame = requestAnimationFrame(updatePitch);
                    return;
                }

                let pitch = autoCorrelate(buffer, audioContext.sampleRate);
                if (currentMode === 'clementine') {
                    clementineLesson.acceptPitch(pitch, rms, now);
                    if (audioContext) animationFrame = requestAnimationFrame(updatePitch);
                    return;
                }
                
                if (pitch !== -1) {
                    debugFreq.innerText = `인식된 Hz: ${pitch.toFixed(1)}`;
                    
                    const targetFreq = activeData[currentIndex].freq;
                    
                    if (Math.abs(pitch - targetFreq) < tolerance) {
                        correctFrames++; 
                        if (correctFrames >= requiredFrames) {
                            handleCorrectAnswer();
                        }
                    } else {
                        correctFrames = 0; 
                    }
                } else {
                    correctFrames = 0; 
                }
            }
            animationFrame = requestAnimationFrame(updatePitch);
        }
        const clementineLesson = window.Clementine ? window.Clementine.createLesson({
            selectNotes(notes) { activeData = notes; currentIndex = 0; },
            prepareTarget(index, continuing) {
                currentIndex = index;
                prepareNote();
                if (continuing && hasLiveInput()) {
                    isListening = true;
                    startListenBtn.style.display = 'none';
                    characterImg.src = 'shinbi_2.png';
                }
            },
            stopInput() {
                cancelAdvance(); listenRequest++; isListening = false; isCorrect = false;
                stopMicSystem();
            },
            feedback: setStatus,
            isListening: () => isListening,
            sensitivity: () => inputSensitivity
        }) : null;
    </script>
</body>
</html>
